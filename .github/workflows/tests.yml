name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv venv --python 3.11
      - run: uv pip install -r requirements-dev.txt
      - run: uv run --no-project python -m pytest
      - run: uv run --no-project ruff check data_cleaning_agent tests start.py main.py
      - run: uv run --no-project ruff format --check data_cleaning_agent tests start.py main.py
      - run: uv run --no-project python -m data_cleaning_agent status
